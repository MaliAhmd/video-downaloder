name: CI/CD Deploy to DigitalOcean VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://vidspry.example"

  deploy:
    name: Deploy to DigitalOcean VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/var/www/vidspry"
            REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"

            echo "🚀 Deploying Vidspry to DigitalOcean VPS..."

            # Ensure Docker and Docker Compose are installed
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker is not installed on VPS. Please install Docker and Docker Compose."
              exit 1
            fi

            # Clone repository if it doesn't exist, otherwise pull latest changes
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 Cloning repository into $APP_DIR..."
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "🔄 Pulling latest commits in $APP_DIR..."
              cd "$APP_DIR"
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Write environment variables
            echo "⚙️ Configuring environment variables..."
            cat << 'EOF' > .env
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            GOOGLE_SITE_VERIFICATION=${{ secrets.GOOGLE_SITE_VERIFICATION }}
            APP_PORT=${{ secrets.APP_PORT || '3001' }}
            NODE_ENV=production
            EOF

            # Build and restart containers using Docker Compose
            echo "🐳 Building and starting Docker container..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            # Clean up old unused Docker images to save VPS disk space
            echo "🧹 Pruning dangling docker images..."
            docker image prune -f

            # Verify container health
            echo "🩺 Verifying container status..."
            docker ps --filter "name=vidspry"

            echo "✅ Deployment completed successfully!"
